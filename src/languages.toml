# ╭───────────────────────────────────────────────────────────────────────────╮
# │ Python                                                                    │
# ╰───────────────────────────────────────────────────────────────────────────╯
# - pip install -U 'python-lsp-server[all]'
# - pip install pyright ruff pylyzer

# [[language]]
# name = "python"
# auto-format = true
# language-servers = [ "pylsp" ]

# [language-server.pylsp.config.pylsp]
# plugins.pylsp_mypy.enabled = true
# plugins.pylsp_mypy.live_mode = true

# - `uv tool install basedpyright` (type checking), `brew install ruff` (lint, format)

[[language]]
name = "python"
auto-format = true
language-servers = ["basedpyright", "ruff"]
# Without an explicit formatter, Helix formats with the first server that
# offers it. The file name lets ruff find the project's own configuration.
formatter = { command = "ruff", args = ["format", "--stdin-filename", "%{buffer_name}", "-"] }

# [language-server.pyright.config.python.analysis]
# typeCheckingMode = "basic"

[language-server.ruff]
command = "ruff"
args = ["server"]

# [language-server.pylyzer]
# command = "pylyzer"
# args = ["--server"]

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ Rust                                                                      │
# ╰───────────────────────────────────────────────────────────────────────────╯

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]

# Run clippy on save. Lint levels come from each project's `[lints]` table.
[language-server.rust-analyzer.config]
check = { command = "clippy" }
# cargo = { features = "all" }

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ Swift                                                                     │
# ╰───────────────────────────────────────────────────────────────────────────╯

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ TOML                                                                      │
# ╰───────────────────────────────────────────────────────────────────────────╯

# ╭───────────────────────────────────────────────────────────────────────────╮
# │ Typst                                                                     │
# ╰───────────────────────────────────────────────────────────────────────────╯
# - `cargo install --locked tinymist`

[[language]]
name = "typst"
language-servers = ["tinymist"]

[language-server.tinymist]
command = "tinymist"

