inherits = "solarized_dark"

"ui.background" = { bg = "black" }  # color of main background
"ui.background.separator" = "base1"  # color of line in fuzzy find pickers

"ui.menu" = { bg = "black", fg = "base01" }  # color of unselected items in `:` command mode
"ui.menu.selected" = { bg = "black", fg = "base1" }  # color of selected items in `:` command mode

"ui.help" = { bg = "black", fg = "base1" }

"ui.popup" = { bg = "base01" }
"ui.popup.info" = { fg = "base1" }

"ui.statusline" = "base1"
"ui.statusline.inactive" = "base01"
"ui.statusline.background" = "base01"

"ui.text.info" = "base01"  # = text color of entries when pressed `SPACE`

"ui.linenr" = { bg = "black", fg = "base01" }
"ui.linenr.selected" = { bg = "black", fg = "blue", modifiers = ["bold"] }

"ui.bufferline" = { bg = "black", fg = "base01" }
"ui.bufferline.active" = { bg = "black", fg = "base1" }

"ui.window" = { fg = "base01" }  # = color of line between editor splits

